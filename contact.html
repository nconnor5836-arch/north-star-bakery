<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact North Star Bakery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Contact Us</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Pre-Order or Question</h2>

      <form id="contactForm" novalidate>
        <fieldset>

          <legend>Request Information</legend>

          <label for="name">Name:</label>
          <input id="name" name="name" type="text">
          <p id="nameError" class="error-message"></p>

          <label for="email">Email:</label>
          <input id="email" name="email" type="email">
          <p id="emailError" class="error-message"></p>

          <label for="date">Pickup Date:</label>
          <input id="date" name="date" type="date" required>

          <label for="type">Request Type:</label>
          <select id="type" name="type" required>
            <option value="">Choose</option>
            <option value="Pre-Order">Pre-Order</option>
            <option value="General Question">General Question</option>
          </select>

          <label for="details">Item Details:</label>
          <textarea id="details" name="details" required></textarea>

          <label for="allergy">Allergy Notes:</label>
          <textarea id="allergy" name="allergy"></textarea>

          <button type="submit">Submit</button>

        </fieldset>
      </form>
    </section>

    <section>
      <h2>Hours</h2>
      <p>Mon-Fri: 7 AM-6 PM | Sat: 8 AM-4 PM | Sun: Closed</p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
