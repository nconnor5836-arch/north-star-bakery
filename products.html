<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery Products | North Star Bakery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Our Products</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Breads</h2>
      <p>Fresh artisan breads: $5-$12.</p>

      <img src="bakery-bread_c.png"
           alt="Fresh artisan bread">

      <figure>
        <img src="bakery-signature-loaf_c.png"
             alt="North Star Bakery signature loaf">
        <figcaption>Our fresh Signature Loaf.</figcaption>
      </figure>
    </section>

    <section>
      <h2>Pastries</h2>
      <p>Fresh pastries: $3-$8.</p>
    </section>

    <section>
      <h2>Cakes</h2>
      <p>Celebration cakes: $25-$75.</p>
    </section>

    <section>
      <h2>Choose Your Favorite</h2>

      <label for="favoriteProduct">Favorite Product:</label>

      <select id="favoriteProduct">
        <option value="">Choose a product</option>
        <option value="Signature Loaf">Signature Loaf</option>
        <option value="Pastries">Pastries</option>
        <option value="Celebration Cake">Celebration Cake</option>
      </select>

      <button type="button" id="saveFavorite">
        Save Favorite
      </button>

      <p id="favoriteMessage"></p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
